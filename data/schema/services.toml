# ==========================================================================
# services.toml — Service Catalog [SITE LAYER]
# ==========================================================================
# >>> Alusat aluminum extrusion services. <<<
# url_path must match the content directory path so the schema engine
# (layouts/partials/schema/render.html) emits Service JSON-LD automatically.
# Add one [[services]] block + a [<lang>.<id>] map per language you support.
# ==========================================================================

# --- Service catalog (language-neutral IDs) ---

[[services]]
id = "custom-aluminum-extrusion"
schema_type = "Service"
url_path = "/services/custom-aluminum-extrusion/"
sort_order = 1

[[services]]
id = "extrusion-fabrication"
schema_type = "Service"
url_path = "/services/extrusion-fabrication/"
sort_order = 2

[[services]]
id = "aluminum-cnc-machining"
schema_type = "Service"
url_path = "/services/aluminum-cnc-machining/"
sort_order = 3

[[services]]
id = "aluminum-surface-finishing"
schema_type = "Service"
url_path = "/services/aluminum-surface-finishing/"
sort_order = 4

# --- Localized service names and descriptions ---

[en.custom-aluminum-extrusion]
name = "Custom Aluminum Extrusion Services"
description = "Design and extrusion of custom aluminum profiles from your drawings, with in-house die development in 6061, 6063 and other alloys for demanding OEM applications."

[en.extrusion-fabrication]
name = "Aluminum Extrusion Fabrication Services"
description = "Value-added fabrication of extruded aluminum profiles — precision cutting, drilling, tapping, bending, welding and assembly into finished components."

[en.aluminum-cnc-machining]
name = "Aluminum CNC Machining Services"
description = "Multi-axis CNC milling and turning of aluminum extrusions and profiles to tight, repeatable tolerances for functional and mating features."

[en.aluminum-surface-finishing]
name = "Aluminum Surface Finishing Services"
description = "Anodizing, powder coating, polishing and brushing to protect aluminum parts and meet appearance and corrosion-resistance specifications."

[de.custom-aluminum-extrusion]
name = "Kundenspezifische Aluminium-Strangpressleistungen"
description = "Konstruktion und Strangpressen kundenspezifischer Aluminiumprofile nach Ihren Zeichnungen, mit eigener Werkzeugentwicklung in 6061, 6063 und weiteren Legierungen für anspruchsvolle OEM-Anwendungen."

[de.extrusion-fabrication]
name = "Aluminium-Strangpress-Weiterverarbeitung"
description = "Weiterverarbeitung stranggepresster Aluminiumprofile mit Mehrwert — präzises Schneiden, Bohren, Gewindeschneiden, Biegen, Schweißen und Montage zu fertigen Bauteilen."

[de.aluminum-cnc-machining]
name = "Aluminium-CNC-Bearbeitungsleistungen"
description = "Mehrachsige CNC-Fräs- und Drehbearbeitung von Aluminiumprofilen und Strangpressteilen auf engste, wiederholbare Toleranzen für Funktions- und Passflächen."

[de.aluminum-surface-finishing]
name = "Aluminium-Oberflächenveredelung"
description = "Eloxieren, Pulverbeschichten, Polieren und Bürsten zum Schutz von Aluminiumteilen und zur Einhaltung von Optik- und Korrosionsschutzvorgaben."

[ja.custom-aluminum-extrusion]
name = "カスタムアルミ押出サービス"
description = "お客様の図面に基づくカスタムアルミ形材の設計・押出。6061・6063などの合金で自社金型を開発し、要求の厳しいOEM用途に対応します。"

[ja.extrusion-fabrication]
name = "アルミ押出加工サービス"
description = "押出アルミ形材の付加価値加工 — 精密切断・穴あけ・タップ・曲げ・溶接・組立により完成部品に仕上げます。"

[ja.aluminum-cnc-machining]
name = "アルミCNC機械加工サービス"
description = "アルミ押出材・形材の多軸CNCフライス・旋盤加工により、機能面・嵌合面を高精度かつ再現性よく仕上げます。"

[ja.aluminum-surface-finishing]
name = "アルミ表面処理サービス"
description = "陽極酸化・粉体塗装・研磨・ヘアライン加工により、アルミ部品を保護し、外観と耐食性の要件を満たします。"

[fr.custom-aluminum-extrusion]
name = "Services d'extrusion d'aluminium sur mesure"
description = "Conception et extrusion de profilés aluminium sur mesure d'après vos plans, avec développement de matrices en interne en 6061, 6063 et autres alliages pour des applications OEM exigeantes."

[fr.extrusion-fabrication]
name = "Services de fabrication d'extrusion d'aluminium"
description = "Fabrication à valeur ajoutée de profilés aluminium extrudés — coupe de précision, perçage, taraudage, cintrage, soudure et assemblage en composants finis."

[fr.aluminum-cnc-machining]
name = "Services d'usinage CNC d'aluminium"
description = "Fraisage et tournage CNC multi-axes de profilés et extrusions aluminium pour des tolérances serrées et répétables sur les surfaces fonctionnelles."

[fr.aluminum-surface-finishing]
name = "Services de finition de surface de l'aluminium"
description = "Anodisation, peinture poudre, polissage et brossage pour protéger les pièces aluminium et répondre aux exigences d'aspect et de résistance à la corrosion."

[es.custom-aluminum-extrusion]
name = "Servicios de extrusión de aluminio personalizada"
description = "Diseño y extrusión de perfiles de aluminio personalizados a partir de sus planos, con desarrollo de matrices propio en 6061, 6063 y otras aleaciones para aplicaciones OEM exigentes."

[es.extrusion-fabrication]
name = "Servicios de fabricación de extrusión de aluminio"
description = "Fabricación de valor añadido de perfiles de aluminio extruido — corte de precisión, taladrado, roscado, curvado, soldadura y montaje en componentes terminados."

[es.aluminum-cnc-machining]
name = "Servicios de mecanizado CNC de aluminio"
description = "Fresado y torneado CNC multieje de extrusiones y perfiles de aluminio con tolerancias ajustadas y repetibles para superficies funcionales y de acoplamiento."

[es.aluminum-surface-finishing]
name = "Servicios de acabado de superficies de aluminio"
description = "Anodizado, recubrimiento en polvo, pulido y cepillado para proteger las piezas de aluminio y cumplir las especificaciones de aspecto y resistencia a la corrosión."
