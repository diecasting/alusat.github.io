# >>> Alusat company identity. <<<
# Feeds Organization, ManufacturingBusiness, and WebSite schemas (JSON-LD is
# generated automatically by layouts/partials/schema/*.html).
# Brand name/email/logo also fall back to config/_default/params.toml.
# ==========================================================================

# --- Brand identity (legalName, logo, url, address, geo, sameAs, certs) ---
# now lives in config/branding/schema.toml. This file keeps only the
# multilingual marketing text rendered at the Organization level.

# --- Multilingual metadata (rendered at Organization level) ---

[en]
name = "Alusat"
description = "Alusat is a professional aluminum extrusion manufacturer in Dongguan, China, providing custom aluminum profiles, extrusion fabrication, CNC machining and surface finishing solutions for global OEM customers."
keywords = [
  "Aluminum Extrusion Manufacturer",
  "Custom Aluminum Profiles",
  "Aluminum Extrusion Fabrication",
  "Aluminum CNC Machining",
  "Aluminum Surface Finishing"
]
site_title = "Alusat"
slogan = "Aluminum Extrusion Manufacturer"

