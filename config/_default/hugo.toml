# ==========================================================================
# hugo.toml — Alusat (Multilingual Configuration)
# ==========================================================================
# Base content language: English (en) at site root.
# Secondary languages served under language prefixes: /de/ /ja/ /fr/ /es/
# All other branding lives in config/_default/params.toml.
# ==========================================================================
#
# DEPLOYMENT / baseURL
# --------------------------------------------------------------------------
# Current target: GitHub Pages PROJECT site for repo diecasting/alusat.github.io
#   -> served at https://diecasting.github.io/alusat.github.io/
# The path prefix (/alusat.github.io/) is REQUIRED for a project page so that
# all asset, canonical, hreflang, sitemap and JSON-LD URLs resolve correctly.
#
# CUSTOM DOMAIN (future alusat.com) — 2-step switch, kept ready:
#   1. Change baseURL below to:  "https://alusat.com/"
#   2. Rename  static/CNAME.example  ->  static/CNAME   (content: alusat.com)
#      (Hugo copies static/CNAME into public/, which GitHub Pages reads to bind
#       the custom domain.) No layout or schema changes needed — every URL is
#       derived from baseURL via .Permalink.
# ==========================================================================

baseURL = "https://diecasting.github.io/alusat.github.io/"
locale = "en-US"
title = "Alusat"
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false
enableRobotsTXT = true
enableGitInfo = true
enableMissingTranslationPlaceholders = false

# Pagination
paginate = 12

# Output formats — HTML + RSS (home/section) + HTML (page).
# Hugo generates /sitemap.xml (all languages) automatically.
[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]
  page = ["HTML"]

# Taxonomies
[taxonomies]
  category = "categories"
  tag = "tags"

# Minify configuration
[minify]
  minifyOutput = true
  [minify.tdewolff]
    [minify.tdewolff.html]
      keepComments = false
    [minify.tdewolff.css]
      precision = 0
    [minify.tdewolff.js]
      precision = 0

# Markup configuration
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.parser]
      autoHeadingID = true
      autoHeadingIDType = "github"
  [markup.highlight]
    style = "github"
    lineNos = false
    noClasses = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4

# RSS service limits
[services]
  [services.rss]
    limit = 10
