# ==========================================================================
# hugo.toml — Alusat (Multilingual Configuration)
# ==========================================================================
# Base content language: English (en) at site root.
# Secondary languages served under language prefixes: /de/ /ja/ /fr/ /es/
# All other branding lives in config/_default/params.toml.
# ==========================================================================
#
# DEPLOYMENT / baseURL
# --------------------------------------------------------------------------
# Custom domain: https://blog.alusat.com/
#   -> served from the master branch via GitHub Actions (build_type: workflow).
#   blog.alusat.com is a custom domain at the ROOT (no project-page path
#   prefix), so all asset, canonical, hreflang, sitemap and JSON-LD URLs now
#   resolve at the domain root.
#
# CUSTOM DOMAIN binding:
#   static/CNAME  (content: blog.alusat.com) is copied into public/ by Hugo and
#   read by GitHub Pages to bind the custom domain. DNS for blog.alusat.com must
#   point at GitHub Pages (A records 185.199.108-111.153 or CNAME to
#   your GitHub Pages default domain) for the domain to actually resolve.
# Every URL is derived from baseURL via .Permalink — no layout/schema edits
# beyond this file + the CNAME file.
# ==========================================================================

baseURL = "https://alusat.com/"
locale = "en-US"
title = "Alusat"
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false
enableRobotsTXT = true
enableGitInfo = true
enableMissingTranslationPlaceholders = false

# Pagination
paginate = 12

# Output formats — HTML + RSS (home/section) + HTML (page).
# Hugo generates /sitemap.xml (all languages) automatically.
[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]
  page = ["HTML"]

# Taxonomies
[taxonomies]
  category = "categories"
  tag = "tags"

# Blog permalinks — content/post/* publishes at /blog/<slug>/
[permalinks]
  post = "/blog/:slug/"

# Minify configuration
[minify]
  minifyOutput = true
  [minify.tdewolff]
    [minify.tdewolff.html]
      keepComments = false
    [minify.tdewolff.css]
      precision = 0
    [minify.tdewolff.js]
      precision = 0

# Markup configuration
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.parser]
      autoHeadingID = true
      autoHeadingIDType = "github"
  [markup.highlight]
    style = "github"
    lineNos = false
    noClasses = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4

# RSS service limits
[services]
  [services.rss]
    limit = 10
