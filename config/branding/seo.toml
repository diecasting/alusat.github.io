# ==========================================================================
# seo.toml — Site-wide SEO Defaults (EDIT THIS TO BRAND YOUR SITE)
# ==========================================================================
# SINGLE SOURCE OF TRUTH for site-wide SEO defaults. Merged into
# config/_default/params.toml by scripts/sync-branding.py.
# Templates read these values as .Site.Params.seo.*
# Per-page front matter `description` / `seo` overrides these.
# IMPORTANT: keep `description` inside [params.seo] so it resolves as
# .Site.Params.seo.description (the site-wide meta-description fallback).
# ==========================================================================

[params]
[params.seo]
  description = "Alusat is a professional aluminum extrusion manufacturer in Dongguan, China, providing custom aluminum profiles, extrusion fabrication, CNC machining and surface finishing solutions for global OEM customers."
  keywords = ["aluminum extrusion manufacturer", "custom aluminum profiles", "aluminum extrusion services", "aluminum fabrication services", "CNC machining aluminum", "aluminum surface finishing", "OEM aluminum extrusion China"]
